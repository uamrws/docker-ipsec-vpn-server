services:
  vpn:
    build: .
    image: ipsec-vpn-server:strongswan
    restart: always
    env_file:
      - ./vpn.env
    # Bridge network with only the IPsec ports published.
    # Do not set network_mode: host. Host network applies this
    # container's iptables, sysctl and routes to the Raspberry Pi.
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/ppp:/dev/ppp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.send_redirects=0
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.accept_redirects=0
      - net.ipv4.conf.default.send_redirects=0
      - net.ipv4.conf.default.rp_filter=0
      - net.ipv6.conf.all.forwarding=1
    hostname: ipsec-vpn-server
    container_name: ipsec-vpn-server
    volumes:
      - ./ipsec.d:/etc/ipsec.d
    # To enable IPv6 support for IKEv2 clients, the Docker host must have a
    # public IPv6 address. Uncomment the network section below and configure
    # IPv6 in your Docker daemon (set "ipv6": true and "fixed-cidr-v6" in
    # /etc/docker/daemon.json), then re-create this container.
    # networks:
    #   vpnnet:

# networks:
#   vpnnet:
#     enable_ipv6: true
#     ipam:
#       config:
#         - subnet: fddd:1::/64
